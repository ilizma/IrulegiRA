<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irulegi - detalle</title>
    <style>@import url("style.css?v=12.0");</style>
</head>
<body>
    <div class="lang-switch">
        <button class="lang-btn" id="lang-btn" onclick="toggleLanguage()">ES</button>
    </div>
    <div class="container">
        <div class="detail-container">
            <h1 id="detail-title" data-i18n="detail.loading">Cargando...</h1>
            <img id="detail-icon" src="" alt="Icono" class="detail-img">
            <div id="detail-description" class="description">
                <!-- The description will be loaded dynamically -->
            </div>
            
            <button id="activate-ar-btn" class="ar-trigger-btn" data-i18n="detail.activate-ar">VER EN REALIDAD AUMENTADA / IKUSI ERREALITATE AREAGOTUAN</button>
            
            <div class="nav-buttons">
                <a href="objects.html" class="back-link" data-i18n="detail.back">← Volver / Itzuli</a>
            </div>
        </div>
    </div>

    <!-- An invisible but present AR viewer -->
    <model-viewer 
        id="ar-viewer"
        src="" 
        ar 
        ar-modes="webxr quick-look" 
        camera-controls
        ar-scale="auto"
        style="width: 1px; height: 1px; opacity: 0; position: absolute; pointer-events: none;">
    </model-viewer>

    <!-- Customised modal for alerts -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <p id="modal-message"></p>
            <button onclick="closeModal()" class="modal-btn">Ok</button>
        </div>
    </div>

    <footer class="logos-footer">
        <img src="images/logos.png" alt="Logos institucionales" class="footer-image">
        <p class="grant-text" data-i18n="index.footer.grant-text">Esta iniciativa ha contado con una subvención enmarcada en el Plan de Recuperación, Transformación y Resiliencia - Financiado por la Unión Europea-NextGeneration EU, dentro del Plan de Sostenibilidad Turística en Destino Comarca Pamplona Rural.</p>
    </footer>

    <script src="lang.js?v=3.1"></script>
    <script src="script-google.js?v=3.0"></script>
    <script src="script.js?v=12.0"></script>
    <script>
        let currentModelId = null;
        
        // Override applyTranslations for detail page
        function applyTranslations() {
            document.title = translations.detail.title;
            
            // Update static elements
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                const keys = key.split('.');
                let value = translations;
                for (const k of keys) {
                    if (value[k]) {
                        value = value[k];
                    } else {
                        value = null;
                        break;
                    }
                }
                if (value) {
                    el.textContent = value;
                }
            });
            
            // Update dynamic content if model is loaded
            if (currentModelId) {
                loadContent();
            }
        }
        
        function loadContent() {
            const data = translations.detail.objects[currentModelId];
            if (data) {
                document.getElementById('detail-title').innerText = data.title;
                document.getElementById('detail-icon').src = 'images/img_objects.png';
                
                const descContainer = document.getElementById('detail-description');
                descContainer.innerHTML = '';
                data.paragraphs.forEach(text => {
                    const p = document.createElement('p');
                    p.innerText = text;
                    descContainer.appendChild(p);
                });
                
                document.getElementById('activate-ar-btn').onclick = () => {
                    startAR(currentModelId, data.title);
                };
            } else {
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            currentModelId = params.get('model');
            
            // Wait for translations to load before showing content
            const checkTranslations = setInterval(() => {
                if (translations && translations.detail && translations.detail.objects) {
                    clearInterval(checkTranslations);
                    loadContent();
                }
            }, 100);
            
            // Timeout in case translations fail to load
            setTimeout(() => clearInterval(checkTranslations), 5000);
        });
    </script>
</body>
</html>
