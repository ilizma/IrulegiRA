    <script src="lang.js?v=3.1"></script>
    <script>
        // Override applyTranslations for objects page
        function applyTranslations() {
            document.title = translations.objects.title;
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                const keys = key.split('.');
                let value = translations;
                for (const k of keys) {
                    if (value[k]) {
                        value = value[k];
                    } else {
                        value = null;
                        break;
                    }
                }
                if (value) {
                    el.textContent = value;
                }
            });
        }
    </script>
