<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Irulegi AR</title>
    <style>
        body {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #9d6d6d; color: white;
            font-family: sans-serif; text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top: 4px solid white;
            width: 36px; height: 36px;
            animation: spin 1s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin: 0; font-size: 16px; }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p>Redirigiendo…</p>
    </div>
    <script>
        // === Versión actual del visor AR ===
        // Cambia este número cuando actualices ar-viewer.html
        var AR_VERSION = 31;

        var params = new URLSearchParams(window.location.search);
        var model = params.get('model') || 'castle';

        // Redirigir al visor con la versión correcta
        window.location.replace('ar-viewer.html?model=' + model + '&v=' + AR_VERSION);
    </script>
</body>
</html>
