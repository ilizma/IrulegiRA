<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Irulegi AR</title>
    <link rel="stylesheet" href="qr-style.css?v=31">
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p>Redirigiendo…</p>
    </div>
    <script>
        // === Versión actual del visor AR ===
        // Cambia este número cuando actualices ar-viewer.html
        var AR_VERSION = 31;

        var params = new URLSearchParams(window.location.search);
        var model = params.get('model') || 'castle';

        // Redirigir al visor con la versión correcta
        window.location.replace('ar-viewer.html?model=' + model + '&v=' + AR_VERSION);
    </script>
</body>
</html>
